# ============================================================
# Nginx: NextCloud + Knowledge Base Bot Mini App (поддомен)
# ============================================================
#
# Два поддомена, один сервер:
#   https://nextcloud.example.ru      → NextCloud (уже работает)
#   https://knowledgebotminiapp.example.ru → Bot Mini App (Telegram Web App)
#
# SSL-сертификат:
#   - Wildcard *.example.ru (один сертификат на оба поддомена)
#   - ИЛИ отдельные сертификаты через Let's Encrypt для каждого поддомена
#
# Установка:
#   1. Создайте DNS A-запись: knowledgebotminiapp.example.ru → IP сервера
#   2. Получите SSL-сертификат (см. инструкции ниже)
#   3. Скопируйте этот файл или добавьте server-блок в ваш конфиг
#   4. nginx -t && systemctl reload nginx
# ============================================================


# ============================================================
# Mini App — отдельный поддомен
# ============================================================

# HTTP → HTTPS редирект
server {
    listen 80;
    listen [::]:80;
    server_name knowledgebotminiapp.example.ru;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knowledgebotminiapp.example.ru;

    # === SSL ===
    # Вариант A: Wildcard-сертификат (общий с NextCloud)
    # ssl_certificate /etc/letsencrypt/live/example.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    # Вариант B: Отдельный сертификат для поддомена
    ssl_certificate /etc/letsencrypt/live/knowledgebotminiapp.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledgebotminiapp.example.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Проксирование всех запросов в контейнер Mini App
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (на будущее)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}


# ============================================================
# NextCloud — основной поддомен (ваш существующий конфиг)
# ============================================================
# Если у вас уже есть работающий конфиг NextCloud —
# НЕ ТРОГАЙТЕ его. Добавьте только server-блок Mini App выше.
