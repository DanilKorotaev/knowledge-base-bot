# ============================================================
# Nginx server-блок для Mini App (отдельный поддомен)
# ============================================================
# Добавьте этот блок в конфиг Nginx или создайте отдельный файл:
#   /etc/nginx/sites-available/knowledgebotminiapp.example.ru
#
# Не забудьте:
#   1. DNS A-запись для knowledgebotminiapp.example.ru → IP сервера
#   2. SSL-сертификат (certbot или wildcard)
#   3. ln -s /etc/nginx/sites-available/... /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name knowledgebotminiapp.example.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knowledgebotminiapp.example.ru;

    ssl_certificate /etc/letsencrypt/live/knowledgebotminiapp.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledgebotminiapp.example.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
