version: '3.8'

services:
  bot:
    build: .
    container_name: knowledge-base-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Локальная копия базы знаний (синхронизируется с NextCloud)
      # Используется абсолютный путь вне базы знаний, чтобы избежать рекурсии
      - ~/.local/share/knowledge-base-bot/kb:/var/knowledge-base-bot/kb
      # Логи бота
      - ./logs:/app/logs
      # Персистентность чатов Cursor CLI (сессии --resume)
      - cursor_chats:/root/.cursor/chats
      # Для локальной разработки: монтировать код (опционально)
      # - .:/app
    depends_on:
      - postgres
    networks:
      - bot-network
    # Для отладки: раскомментируйте для доступа к контейнеру
    # stdin_open: true
    # tty: true

  miniapp:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
    container_name: knowledge-base-bot-miniapp
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MINIAPP_PORT:-8080}:8080"
    volumes:
      # Доступ к базе знаний для просмотра файлов
      - ~/.local/share/knowledge-base-bot/kb:/var/knowledge-base-bot/kb:ro
      # Логи
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - bot-network

  # KB App API (iOS) — HTTP поверх того же кода бота
  kb-app-api:
    build:
      context: .
      dockerfile: kb-app-api/Dockerfile
    container_name: knowledge-base-bot-kb-app-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${KB_APP_API_PORT:-8091}:8091"
    volumes:
      - ~/.local/share/knowledge-base-bot/kb:/var/knowledge-base-bot/kb:rw
      - ./logs:/app/logs
      - cursor_chats:/root/.cursor/chats
    depends_on:
      - postgres
    networks:
      - bot-network

  # Webhook HealthSync (iOS) — связывание JSON с заметками тренировок
  health-sync-api:
    build:
      context: .
      dockerfile: health-sync-api/Dockerfile
    container_name: knowledge-base-bot-health-sync-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HEALTH_SYNC_KB_PATH: /var/knowledge-base-bot/kb
    ports:
      - "${HEALTH_SYNC_API_PORT:-8090}:8090"
    volumes:
      # RW: дописывает frontmatter в .md и linked_note в workout JSON
      - ~/.local/share/knowledge-base-bot/kb:/var/knowledge-base-bot/kb:rw
      - ./logs:/app/logs
    networks:
      - bot-network

  postgres:
    image: postgres:15-alpine
    container_name: knowledge-base-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge_base_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres_data:
  cursor_chats:

networks:
  bot-network:
    driver: bridge

