version: '3.8'

services:
  bot:
    build: .
    container_name: knowledge-base-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./local_kb:/var/knowledge-base-bot/kb
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - bot-network

  postgres:
    image: postgres:15-alpine
    container_name: knowledge-base-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge_base_bot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bot-network

volumes:
  postgres_data:

networks:
  bot-network:
    driver: bridge

