name: Deploy to Mac mini (production)

# Prod only. Staging is deploy-mac-mini-staging.yml (branch staging).
# develop = no auto-deploy.

on:
  push:
    branches:
      - main
    tags:
      - "backend/v*"
  workflow_dispatch:

concurrency:
  group: deploy-mac-mini-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_NOTIFY_PROXY: socks5://127.0.0.1:1080

    steps:
      - name: Pull and deploy production runtime
        id: deploy
        env:
          KB_RUNTIME_DIR: ${{ vars.KB_RUNTIME_DIR }}
        run: |
          set -euo pipefail
          RUNTIME="${KB_RUNTIME_DIR:-$HOME/Projects/knowledge-base-bot}"
          cd "${RUNTIME}"

          if [[ ! -d .git ]]; then
            echo "ERROR: ${RUNTIME} is not a git repo." >&2
            exit 1
          fi

          echo "Before: $(git rev-parse --short HEAD 2>/dev/null || echo none)"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          if [[ -f scripts/deploy-mac-mini.sh ]]; then
            bash scripts/deploy-mac-mini.sh
          else
            echo "ERROR: scripts/deploy-mac-mini.sh missing" >&2
            exit 1
          fi

          echo "After: $(git rev-parse --short HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "Deployed from tag ${GITHUB_REF_NAME}"
          fi

      - name: Notify Telegram (deploy prod)
        if: always()
        env:
          KB_RUNTIME_DIR: ${{ vars.KB_RUNTIME_DIR }}
          KB_DEPLOY_ENV: production
        run: |
          set -euo pipefail
          cd "${KB_RUNTIME_DIR:-$HOME/Projects/knowledge-base-bot}"
          python3 scripts/ci/telegram_notify.py deploy \
            --environment production \
            --outcome "${{ steps.deploy.outcome }}"
