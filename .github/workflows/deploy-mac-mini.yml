name: Deploy to Mac mini (runtime)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-mac-mini
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mac-mini]
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_NOTIFY_PROXY: socks5://127.0.0.1:1080

    steps:
      - name: Pull and deploy runtime
        id: deploy
        env:
          KB_RUNTIME_DIR: /Users/danilkorotaev/Projects/knowledge-base-bot
        run: |
          set -euo pipefail
          RUNTIME="${KB_RUNTIME_DIR}"
          cd "${RUNTIME}"

          if [[ ! -d .git ]]; then
            echo "ERROR: ${RUNTIME} is not a git repo." >&2
            exit 1
          fi

          echo "Before: $(git rev-parse --short HEAD 2>/dev/null || echo none)"
          git fetch origin develop
          git reset --hard origin/develop

          if [[ -f scripts/deploy-mac-mini.sh ]]; then
            bash scripts/deploy-mac-mini.sh
          else
            echo "ERROR: scripts/deploy-mac-mini.sh missing" >&2
            exit 1
          fi

          echo "After: $(git rev-parse --short HEAD)"

      - name: Notify Telegram (deploy)
        if: always()
        working-directory: /Users/danilkorotaev/Projects/knowledge-base-bot
        run: python3 scripts/ci/telegram_notify.py deploy --outcome ${{ steps.deploy.outcome }}
